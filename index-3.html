<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F5EFE6">
<title>Build the Booty</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#F5EFE6;min-height:100vh;font-family:'Cormorant Garamond',Georgia,serif;color:#2B1810;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{background:linear-gradient(180deg,#F5EFE6 0%,#EDE3D3 100%)}
.d{font-family:'Cormorant Garamond',Georgia,serif}
.b{font-family:'Inter',system-ui,sans-serif}
.ink{color:#2B1810}.is{color:#5C4530}.il{color:#8B7355}.cl{color:#C97B5C}.sg{color:#7A8B6F}
.app{padding:40px 20px 80px;max-width:600px;margin:0 auto}
.card{background:#FAF6EE;border:1px solid #D4C5A9;border-radius:2px;padding:18px}
button{cursor:pointer;font-family:inherit;border:none;background:transparent;color:inherit}
.btn-p{background:#2B1810;color:#F5EFE6;padding:14px;width:100%;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;border-radius:2px}
.btn-p:active{transform:scale(0.98)}
.btn-c{background:#C97B5C;color:#FAF6EE;border-radius:2px}
.btn-i{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid #D4C5A9;border-radius:2px;color:#5C4530}
.btn-g{padding:10px 14px;border:1px solid #D4C5A9;border-radius:2px;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:#5C4530}
.inp{background:#FAF6EE;border:1px solid #D4C5A9;color:#2B1810;border-radius:2px;font-family:'Inter',sans-serif;font-size:14px;padding:7px 9px}
.inp:focus{outline:none;border-color:#C97B5C;box-shadow:0 0 0 2px rgba(201,123,92,0.15)}
.inp:disabled{opacity:0.5;background:#EDE3D3}
.eb{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:#8B7355}
.tag{font-family:'Inter',sans-serif;font-size:9px;padding:3px 7px;border-radius:2px;text-transform:uppercase;letter-spacing:0.15em;color:#F5EFE6;display:inline-block}
.tg-gym{background:#2B1810}.tg-home{background:#C97B5C}.tg-up{background:#5C4530}.tg-pel{background:#7A8B6F}
.set-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.set-n{font-family:'Cormorant Garamond',serif;font-size:18px;color:#8B7355;width:20px}
.cb{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:2px;margin-left:auto}
.cb-a{background:#C97B5C;color:#FAF6EE}.cb-d{background:#2B1810;color:#F5EFE6}
.cue{margin-top:10px;padding:11px;background:#F5EFE6;border-left:2px solid #C97B5C}
.pb{height:4px;background:#EDE3D3;flex:1}
.pf{height:100%;background:#C97B5C;transition:width 0.3s}
.fade{animation:f 0.3s ease-out}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ic{display:inline-block;vertical-align:middle}
a{color:inherit;text-decoration:none}
.done{opacity:0.5}
.ex{overflow:hidden;padding:0}
.ex-h{padding:18px;border-bottom:1px solid #D4C5A9}
.ex-s{padding:18px;display:flex;flex-direction:column;gap:10px}
.ex-p{padding:0 18px 14px;display:flex;align-items:center;gap:8px}
.dr{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #EDE3D3}
.dr:last-child{border-bottom:none}
.dl{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#8B7355;width:36px;flex-shrink:0}
.col{background:#EDE3D3;border:1px solid #D4C5A9;border-radius:2px;overflow:hidden}
.col-h{width:100%;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.col-b{padding:4px 18px 18px}
.col-i{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #D4C5A9}
.col-i:last-child{border-bottom:none}
.mc{width:22px;height:22px;border:1.5px solid #8B7355;border-radius:2px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mc.d{background:#2B1810;border-color:#2B1810;color:#F5EFE6}
.pp{display:inline-block;font-family:'Inter',sans-serif;font-size:9px;padding:3px 8px;border-radius:2px;text-transform:uppercase;letter-spacing:0.15em;background:#5C4530;color:#F5EFE6}
.row-sb{display:flex;align-items:center;justify-content:space-between;gap:10px}
.flx{display:flex;align-items:center;gap:8px}
@media(min-width:600px){.app{padding:48px 28px 80px}}
</style>
</head>
<body>
<div id="app"></div>
<script>

// =============== EXERCISE LIBRARY ===============
const EX = {
  // Hip thrusts
  "bb-ht":{n:"Barbell Hip Thrust",u:"lb",sl:185,k:"barbell",cue:"Ribs down, chin tucked, posterior pelvic tilt at the top. Pause 2 sec at top."},
  "bb-ht-pause":{n:"Paused Barbell Hip Thrust",u:"lb",sl:165,k:"barbell",cue:"3-second pause at full extension. Squeeze hard."},
  "bstance-ht":{n:"B-stance Hip Thrust",u:"lb",sl:95,k:"barbell",cue:"70% weight on working leg. Other foot just for balance."},
  "banded-ht":{n:"Banded Barbell Hip Thrust",u:"lb",sl:155,k:"barbell",cue:"Loop band around bar+pad. Adds tension at top of movement."},
  "kb-sl-ht":{n:"KB Single-Leg Hip Thrust",u:"lb KB",sl:60,k:"kb",cue:"Drive through heel. Squeeze at top."},
  "db-ht":{n:"DB Hip Thrust on Bench",u:"lb DB",sl:30,k:"db",cue:"DB on hips, slow controlled reps."},
  "db-sl-ht":{n:"Single-Leg DB Hip Thrust",u:"lb DB",sl:25,k:"db",cue:"DB on hip, opposite foot off floor."},
  "frog-pump":{n:"Frog Pump",u:"lb",sl:0,k:"bodyweight",cue:"Soles together, knees out wide. Squeeze glutes hard at top. Burnout finisher."},

  // Hinges
  "rdl":{n:"Romanian Deadlift",u:"lb",sl:135,k:"barbell",cue:"Push hips back. Bar stays close. Hamstrings load up."},
  "deficit-rdl":{n:"Deficit RDL",u:"lb",sl:115,k:"barbell",cue:"Stand on a 2-3in plate. Greater stretch. Slow eccentric."},
  "sumo-rdl":{n:"Sumo RDL",u:"lb",sl:135,k:"barbell",cue:"Wide stance, toes pointed slightly out. Hits glutes more than narrow."},
  "stiff-leg-dl":{n:"Stiff-Leg Deadlift",u:"lb",sl:135,k:"barbell",cue:"Knees mostly straight. Bar from floor. Massive hamstring/glute stretch."},
  "kb-bstance-rdl":{n:"KB B-stance RDL",u:"lb KB",sl:60,k:"kb",cue:"Push hips back, bell stays close to leg."},
  "kb-sl-rdl":{n:"KB Single-Leg RDL",u:"lb KB",sl:20,k:"kb",cue:"Hinge at hip, back leg extends. Use 20lb KB for balance."},
  "good-morning":{n:"Good Morning",u:"lb",sl:95,k:"barbell",cue:"Bar on traps. Hinge forward. Hamstrings and glutes wake up."},
  "back-ext":{n:"45° Back Extension",u:"lb plate",sl:25,k:"db",cue:"Round upper back slightly. Tuck pelvis. Squeeze glutes to rise."},
  "back-ext-pause":{n:"Paused Back Extension",u:"lb plate",sl:25,k:"db",cue:"2-sec pause at top. Hard glute squeeze."},
  "back-ext-bw":{n:"Back Extension (bodyweight)",u:"reps",sl:0,k:"bodyweight",cue:"High reps. Glute squeeze every rep."},
  "cable-pt":{n:"Cable Pull-Through",u:"lb",sl:60,k:"cable",cue:"RDL pattern with cable. Hip hinge dominant."},

  // Squats / Lunges
  "bulg-split":{n:"Bulgarian Split Squat",u:"lb DBs",sl:30,k:"db",cue:"Long stride. Lean torso slightly forward. Front-leg glute."},
  "walk-lunge":{n:"Walking Lunges",u:"lb DBs",sl:30,k:"db",cue:"Long stride. Drive through front heel."},
  "rev-lunge":{n:"DB Reverse Lunge",u:"lb DBs",sl:30,k:"db",cue:"Step long backward. Lean torso forward for glute bias."},
  "curtsy-lunge":{n:"Curtsy Lunge",u:"lb DBs",sl:25,k:"db",cue:"Step back and across. Hits glute medius. 25 lb is plenty."},
  "kb-step":{n:"KB Goblet Step-Up",u:"lb KB",sl:60,k:"kb",cue:"Drive through heel of working leg. Don't push off trailing leg."},
  "kb-rev-lunge":{n:"KB Goblet Reverse Lunge",u:"lb KB",sl:60,k:"kb",cue:"Long step back. Lean torso slightly forward."},
  "kb-sumo":{n:"KB Sumo Deadlift",u:"lb KB",sl:60,k:"kb",cue:"Wide stance. Push knees out. Squeeze glutes at top."},
  "front-squat":{n:"Front Squat",u:"lb",sl:95,k:"barbell",cue:"Bar in front rack. Upright torso. Quad+glute focus."},
  "elev-side-lunge":{n:"Elevated Side Lunge",u:"lb DBs",sl:20,k:"db",cue:"Stand on bench/plate. Step out wide. Sit into the working leg."},
  "elev-curtsy":{n:"Elevated Curtsy Lunge",u:"lb DBs",sl:20,k:"db",cue:"Stand elevated. Step back and across. Glute medius killer."},

  // Glute medius / band
  "cable-kb":{n:"Cable Kickback",u:"lb",sl:25,k:"cable",cue:"Slight bend in working leg. Drive heel back AND up."},
  "seated-abd":{n:"Seated Cable Abduction",u:"lb",sl:70,k:"cable",cue:"Pad on outside of knees. Lean torso forward 30°."},
  "stand-abd":{n:"Standing Cable Abduction",u:"lb",sl:25,k:"cable",cue:"Cable on ankle. Lift leg straight out to side. Top of glute work."},
  "banded-kb":{n:"Banded Kickback",u:"band",sl:0,k:"band",cue:"Loop band around ankle. Drive heel back and up."},
  "banded-bridge":{n:"Banded Glute Bridge",u:"band",sl:0,k:"band",cue:"Push knees apart against the band."},
  "banded-walk":{n:"Banded Lateral Walks",u:"band",sl:0,k:"band",cue:"Stay low. Small steps. Don't let knees cave."},
  "banded-clam":{n:"Banded Clamshell",u:"band",sl:0,k:"band",cue:"Heels together. Slow and controlled."},
  "banded-fh":{n:"Banded Fire Hydrant",u:"band",sl:0,k:"band",cue:"Hips square to floor. Lift leg out to side."},
  "kb-swings":{n:"KB Russian Swings",u:"lb KB",sl:60,k:"kb",cue:"Hip hinge, NOT a squat. Bell floats up from hip snap."},

  // Upper Push - Gym
  "db-bench":{n:"DB Bench Press",u:"lb DBs",sl:25,k:"db",cue:"Slight arch. Elbows 45° from torso."},
  "incline-db":{n:"Incline DB Press",u:"lb DBs",sl:20,k:"db",cue:"Bench at 30-45°. Press up and slightly back."},
  "db-ohp":{n:"DB Overhead Press",u:"lb DBs",sl:20,k:"db",cue:"Core tight, ribs down. Press straight up."},
  "lat-raise":{n:"DB Lateral Raise",u:"lb DBs",sl:10,k:"db",cue:"Lead with elbows. Light weight, strict form."},
  "tri-pd":{n:"Tricep Pushdown",u:"lb",sl:40,k:"cable",cue:"Elbows pinned to sides. Squeeze at lockout."},
  "skull-crusher":{n:"DB Skull Crusher",u:"lb DBs",sl:15,k:"db",cue:"Lay on bench. Lower DBs to forehead. Triceps work."},
  "farmer":{n:"Farmer Carry",u:"lb DBs",sl:30,k:"db",cue:"Stand tall. Shoulders down. Walk with purpose."},

  // Upper Push - Home
  "kb-floor":{n:"KB Floor Press",u:"lb KB",sl:60,k:"kb",cue:"Lay flat. Press KB up. Elbow gently touches floor each rep."},
  "db-floor":{n:"DB Floor Press",u:"lb DBs",sl:25,k:"db",cue:"Lay on bench or floor. Slight pause when elbows touch."},
  "incline-db-home":{n:"Incline DB Press (Home)",u:"lb DBs",sl:20,k:"db",cue:"Set bench at incline. Press up."},
  "kb-press":{n:"KB Strict Press",u:"lb KB",sl:20,k:"kb",cue:"One arm. Press straight overhead. Use 20lb KB."},
  "db-shldr":{n:"DB Shoulder Press",u:"lb DBs",sl:20,k:"db",cue:"Seated or standing. Press up, don't flare elbows wide."},
  "band-lat-r":{n:"Banded Lateral Raise",u:"band",sl:0,k:"band",cue:"Stand on band, raise arms to sides. Strict form."},
  "band-tri":{n:"Banded Tricep Extension",u:"band",sl:0,k:"band",cue:"Anchor band overhead. Elbows pinned. Extend down."},
  "kb-farmer":{n:"KB Farmer Carry",u:"lb KB",sl:60,k:"kb",cue:"One side at a time. 40 yards. Switch sides."},

  // Upper Pull - Gym
  "lat-pd":{n:"Lat Pulldown",u:"lb",sl:70,k:"cable",cue:"Pull bar to upper chest. Drive elbows down and back."},
  "cable-row":{n:"Seated Cable Row",u:"lb",sl:70,k:"cable",cue:"Pull to belly button. Squeeze blades. Don't lean back."},
  "db-row":{n:"DB Row",u:"lb DB",sl:30,k:"db",cue:"Pull DB to hip, not chest. Squeeze shoulder blade."},
  "face-pull":{n:"Face Pull",u:"lb",sl:30,k:"cable",cue:"Pull rope to face. External rotate at end."},
  "db-curl":{n:"DB Curl",u:"lb DBs",sl:15,k:"db",cue:"Elbows still. Slow eccentric."},
  "hammer-curl":{n:"Hammer Curl",u:"lb DBs",sl:15,k:"db",cue:"Neutral grip. Hits brachialis for arm thickness."},
  "side-plank":{n:"Side Plank",u:"sec",sl:30,k:"bodyweight",cue:"Stack hips. Don't let them sag."},

  // Upper Pull - Home
  "kb-row":{n:"KB Row",u:"lb KB",sl:60,k:"kb",cue:"Hinge over bench. Pull KB to hip."},
  "band-pa":{n:"Banded Pull-Apart",u:"band",sl:0,k:"band",cue:"Arms straight, pull band apart to chest level."},
  "band-row":{n:"Banded Row",u:"band",sl:0,k:"band",cue:"Anchor band. Pull elbows back, squeeze blades."},
  "band-fp":{n:"Banded Face Pull",u:"band",sl:0,k:"band",cue:"Anchor at face height. Pull to face, external rotate."},
  "kb-curl":{n:"KB Curl",u:"lb KB",sl:20,k:"kb",cue:"Two-handed curl with 20lb KB. Slow eccentric."},
  "db-curl-home":{n:"DB Curl",u:"lb DBs",sl:15,k:"db",cue:"Elbows still. Slow eccentric."}
};

const DEMO = {};
Object.keys(EX).forEach(k => {
  DEMO[k] = "https://www.youtube.com/results?search_query=" + encodeURIComponent(EX[k].n + " form");
});
DEMO["bb-ht"] = "https://www.youtube.com/results?search_query=Bret+Contreras+barbell+hip+thrust+form";
DEMO["rdl"] = "https://www.youtube.com/results?search_query=Squat+University+Romanian+Deadlift";
DEMO["kb-swings"] = "https://www.youtube.com/results?search_query=StrongFirst+kettlebell+swing";

// =============== SESSION TEMPLATES BY PHASE + WEEK ===============
// Each session has a main lift that stays consistent within phase, accessories rotate
// Phase 1 weeks 1-4, Phase 2 weeks 5-8, Phase 3 weeks 9-12

function getMainLift(sessionType, phase, weekInPhase) {
  // weekInPhase 1-4
  if (sessionType === 'heavyHipThrust') {
    if (phase === 1) return { id: "bb-ht", sets: 4, reps: "8" };
    if (phase === 2) return { id: weekInPhase % 2 === 1 ? "bb-ht" : "bb-ht-pause", sets: 5, reps: "5" };
    return { id: weekInPhase === 1 ? "bb-ht-pause" : weekInPhase === 2 ? "bstance-ht" : weekInPhase === 3 ? "banded-ht" : "bb-ht", sets: 4, reps: "5,5,8,8" };
  }
  if (sessionType === 'heavyHinge') {
    if (phase === 1) return { id: weekInPhase % 2 === 1 ? "rdl" : "sumo-rdl", sets: 4, reps: "8" };
    if (phase === 2) return { id: weekInPhase === 1 ? "rdl" : weekInPhase === 2 ? "deficit-rdl" : weekInPhase === 3 ? "sumo-rdl" : "stiff-leg-dl", sets: 5, reps: "5" };
    return { id: weekInPhase % 2 === 1 ? "deficit-rdl" : "good-morning", sets: 4, reps: "6,6,8,10" };
  }
  return null;
}

function getSession(sessionKey, phase, weekInPhase, variant) {
  // variant: 'gym' | 'home'
  const W = weekInPhase;
  const P = phase;

  if (sessionKey === 'heavyHipThrust') {
    if (variant === 'home') {
      // Home version uses bench + KB + back ext
      return {
        name: "Heavy Hip Thrust (Home)", type: "home", category: "glutes",
        ex: [
          { id: P===3 ? "db-sl-ht" : "db-ht", sets: P===2?5:4, reps: P===1?"10":P===2?"8":"6,6,8,10" },
          { id: W % 2 === 1 ? "rev-lunge" : "kb-rev-lunge", sets: 3, reps: "10/side" },
          { id: P===3 ? "back-ext-pause" : "back-ext", sets: 4, reps: P===1?"12":P===2?"10":"12" },
          { id: "banded-kb", sets: 3, reps: "15/side" },
          { id: W===1?"banded-walk":W===2?"banded-clam":W===3?"banded-fh":"banded-bridge", sets: 3, reps: "20" }
        ]
      };
    }
    // Gym version
    const main = getMainLift('heavyHipThrust', P, W);
    return {
      name: "Heavy Hip Thrust (Gym)", type: "gym", category: "glutes",
      ex: [
        main,
        { id: W % 2 === 1 ? "bulg-split" : "walk-lunge", sets: 3, reps: P===2?"8/side":"10/side" },
        { id: "back-ext", sets: 4, reps: P===1?"12":P===2?"10":"12" },
        { id: W===1?"cable-kb":W===2?"stand-abd":W===3?"cable-kb":"banded-kb", sets: 3, reps: "12/side" },
        { id: "seated-abd", sets: 4, reps: P===2?"12":"15" }
      ]
    };
  }

  if (sessionKey === 'heavyHinge') {
    if (variant === 'home') {
      return {
        name: "Heavy Hinge (Home)", type: "home", category: "glutes",
        ex: [
          { id: W % 2 === 1 ? "kb-bstance-rdl" : "kb-sl-rdl", sets: 4, reps: "10/side" },
          { id: "bulg-split", sets: 3, reps: P===2?"8/side":"10/side" },
          { id: P===3 ? "back-ext-pause" : "back-ext", sets: 4, reps: P===1?"12":P===2?"10":"12" },
          { id: W===1?"curtsy-lunge":W===2?"rev-lunge":W===3?"elev-side-lunge":"elev-curtsy", sets: 3, reps: "10/side" },
          { id: "frog-pump", sets: 2, reps: "30" }
        ]
      };
    }
    const main = getMainLift('heavyHinge', P, W);
    return {
      name: "Heavy Hinge (Gym)", type: "gym", category: "glutes",
      ex: [
        main,
        { id: W % 2 === 1 ? "bulg-split" : "front-squat", sets: 3, reps: P===2?"6/side":"8/side" },
        { id: P===3 ? "back-ext-pause" : "back-ext", sets: 4, reps: P===1?"12":P===2?"10":"12" },
        { id: "cable-pt", sets: 3, reps: P===1?"12":"10" },
        { id: W===1?"seated-abd":W===2?"stand-abd":W===3?"cable-kb":"seated-abd", sets: 3, reps: "15" }
      ]
    };
  }

  if (sessionKey === 'pumpVolume') {
    if (variant === 'home') {
      return {
        name: "Pump + Volume (Home)", type: "home", category: "glutes",
        ex: [
          { id: "kb-swings", sets: 5, reps: P===3?"20":"15" },
          { id: W % 2 === 1 ? "kb-step" : "kb-rev-lunge", sets: 3, reps: "12/side" },
          { id: "kb-sumo", sets: 4, reps: P===1?"15":"12" },
          { id: W===1?"curtsy-lunge":W===2?"elev-side-lunge":W===3?"elev-curtsy":"rev-lunge", sets: 3, reps: "10/side" },
          { id: "banded-kb", sets: 3, reps: "20/side" },
          { id: "frog-pump", sets: 2, reps: "30" }
        ]
      };
    }
    return {
      name: "Pump + Volume (Gym)", type: "gym", category: "glutes",
      ex: [
        { id: W % 2 === 1 ? "bb-ht" : "db-ht", sets: 4, reps: "12" },
        { id: W === 1 ? "curtsy-lunge" : W === 2 ? "elev-side-lunge" : W === 3 ? "elev-curtsy" : "walk-lunge", sets: 3, reps: "12/side" },
        { id: "back-ext", sets: 4, reps: "15" },
        { id: "cable-kb", sets: 3, reps: "15/side" },
        { id: "seated-abd", sets: 4, reps: "20" },
        { id: "frog-pump", sets: 2, reps: "30" }
      ]
    };
  }

  if (sessionKey === 'pumpBands') {
    if (variant === 'gym') {
      return {
        name: "Pump + Glute Medius (Gym)", type: "gym", category: "glutes",
        ex: [
          { id: "bstance-ht", sets: 4, reps: "10/side" },
          { id: "stand-abd", sets: 4, reps: "12/side" },
          { id: "kb-bstance-rdl", sets: 3, reps: "12/side" },
          { id: "cable-kb", sets: 3, reps: "15/side" },
          { id: "seated-abd", sets: 4, reps: "20" },
          { id: "banded-walk", sets: 3, reps: "20 steps" }
        ]
      };
    }
    return {
      name: "Pump + Bands (Home)", type: "home", category: "glutes",
      ex: [
        { id: "kb-sl-ht", sets: 4, reps: "12/side" },
        { id: "back-ext", sets: 3, reps: "15" },
        { id: W % 2 === 1 ? "kb-bstance-rdl" : "kb-sl-rdl", sets: 3, reps: "10/side" },
        { id: "banded-walk", sets: 3, reps: "20 steps" },
        { id: "banded-bridge", sets: 3, reps: P===3?"30":"25" },
        { id: W===1?"banded-clam":W===2?"banded-fh":W===3?"banded-clam":"banded-fh", sets: 3, reps: "20/side" }
      ]
    };
  }

  if (sessionKey === 'upperPush') {
    if (variant === 'gym') {
      return {
        name: "Upper Push (Gym)", type: "upper", category: "upper",
        ex: [
          { id: W % 2 === 1 ? "db-bench" : "incline-db", sets: 4, reps: P===1?"10":P===2?"8":"8" },
          { id: "db-ohp", sets: 3, reps: P===1?"10":"8" },
          { id: "lat-raise", sets: 4, reps: "12" },
          { id: W % 2 === 1 ? "tri-pd" : "skull-crusher", sets: 3, reps: "12" },
          { id: "farmer", sets: 3, reps: "40 yd" }
        ]
      };
    }
    return {
      name: "Upper Push (Home)", type: "home", category: "upper",
      ex: [
        { id: W % 2 === 1 ? "db-floor" : "incline-db-home", sets: 4, reps: P===1?"10":"8" },
        { id: W % 2 === 1 ? "db-shldr" : "kb-press", sets: 3, reps: "8" },
        { id: "band-lat-r", sets: 4, reps: "15" },
        { id: "band-tri", sets: 3, reps: "15" },

// =============== HELPERS ===============
function todayStr() { return new Date().toISOString().split('T')[0]; }
function lk(date, key, week) { return date+'__'+key+'__W'+week; }
function getPhase(w) { return w<=4?1:w<=8?2:3; }
function getWeekInPhase(w) { return ((w-1) % 4) + 1; }
function phaseName(p) { return p===1?"Foundation":p===2?"Strength Bias":"Volume Push"; }

function getLastLog(key, exId) {
  const e = Object.entries(state.logs).filter(([k]) => k.indexOf('__'+key+'__')!==-1).sort(([a],[b]) => b.localeCompare(a));
  for (const [, sd] of e) if (sd[exId]) return sd[exId];
  // Also check any session for this exercise (since exercises rotate)
  const all = Object.entries(state.logs).sort(([a],[b]) => b.localeCompare(a));
  for (const [, sd] of all) if (sd[exId]) return sd[exId];
  return null;
}

function suggestLoad(exId, defaultLoad) {
  const ex = EX[exId];
  if (!ex) return defaultLoad;
  const last = getLastLog('any', exId);
  if (!last || last.length === 0) return defaultLoad;
  const completed = last.filter(s => s && s.completed);
  if (completed.length === 0) return defaultLoad;
  const top = Math.max(...completed.map(s => parseFloat(s.weight) || 0));
  const allDone = last.length === completed.length;
  if (!allDone) return top;
  if (ex.k === 'kb' || ex.k === 'band' || ex.k === 'bodyweight') return top;
  return top + 5;
}

function getProgressionHint(exId) {
  const ex = EX[exId];
  if (!ex) return null;
  const last = getLastLog('any', exId);
  if (!last || last.length === 0) return null;
  const allDone = last.every(s => s && s.completed);
  if (!allDone) return null;
  if (ex.k === 'kb' || ex.k === 'band' || ex.k === 'bodyweight') return "Crushed it. Add 1-2 reps per set this time.";
  return "Last session crushed. +5lb suggested.";
}

function initSets(exId, sets, reps) {
  if (currentSets[exId]) return currentSets[exId];
  const ex = EX[exId];
  if (!ex) return [];
  const suggested = suggestLoad(exId, ex.sl);
  const repBase = String(reps).split(',')[0].split('/')[0].trim();
  const arr = Array(sets).fill(null).map(() => ({ weight: suggested, reps: repBase, completed: false }));
  currentSets[exId] = arr;
  return arr;
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

function fmtSaved(ts) {
  if (!ts) return 'never';
  const diff = Date.now() - ts;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff/60000) + ' min ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + ' hr ago';
  return Math.floor(diff/86400000) + ' days ago';
}

      ${wu ? renderCollapse(wu, 'warmup') : ''}
      <div style="display:flex;flex-direction:column;gap:14px;margin-top:14px">${exHTML}</div>
      ${cd ? '<div style="margin-top:14px">'+renderCollapse(cd, 'cooldown')+'</div>' : ''}
      <button class="btn-p" style="margin-top:28px" onclick="finish()">Finish Session</button>
    </div>`;
}

function renderPelotonView() {
  const sug = PELOTON_SUGGESTIONS[currentSession];
  const sessionLabel = currentSession==='heavyHipThrust'?'Heavy Hip Thrust':currentSession==='heavyHinge'?'Heavy Hinge':currentSession==='pumpVolume'?'Pump + Volume':currentSession==='pumpBands'?'Pump + Bands':currentSession==='upperPush'?'Upper Push':'Upper Pull';
  return `
    <div class="app fade">
      <button onclick="goView('home')" class="is b" style="display:flex;align-items:center;gap:8px;margin-bottom:20px;padding:0">${I.cl}<span style="font-size:14px">Back</span></button>
      <div style="margin-bottom:24px">
        <span class="tag tg-pel">Peloton</span>
        <h1 class="d ink" style="font-size:30px;line-height:1.1;margin:8px 0 0">${sessionLabel}</h1>
      </div>
      <div class="card" style="margin-bottom:18px">
        <p class="eb" style="margin-bottom:8px">Filter In Peloton App</p>
        <p class="b is" style="font-size:13px;line-height:1.6"><strong class="ink">Strength →</strong> ${sug.focus} → ${sug.duration}</p>
      </div>
      <div class="card" style="margin-bottom:18px">
        <p class="eb" style="margin-bottom:8px">Recommended Coaches</p>
        <p class="b is" style="font-size:13px;line-height:1.6">${sug.coaches}</p>
        <p class="b il" style="font-size:11px;margin-top:8px;font-style:italic">Adrian Williams is the heaviest programmer. Use him for serious work.</p>
      </div>
      <div class="card" style="margin-bottom:18px">
        <p class="eb" style="margin-bottom:8px">Weights To Grab</p>
        <p class="b is" style="font-size:13px;line-height:1.6">Have your full DB range nearby (5-30 lb) plus the 20 lb KB. Class will adjust.</p>
      </div>
      <button class="btn-p" onclick="markPelotonDone()">Mark Class Complete</button>
    </div>`;
}

function renderCollapse(data, type) {
  const isOpen = type === 'warmup' ? warmupOpen : cooldownOpen;
  const checks = type === 'warmup' ? warmupChecks : cooldownChecks;
  const cnt = data.items.filter(i => checks[i.id]).length;
  let items = '';
  if (isOpen) {
    data.items.forEach(item => {
      const done = checks[item.id];
      items += `
        <div class="col-i" style="${done?'opacity:0.5':''}">
          <button class="mc ${done?'d':''}" onclick="toggleColItem('${type}','${item.id}')">${done?I.check:''}</button>
          <div style="flex:1">
            <p class="d ink" style="font-size:15px;margin:0;line-height:1.2">${esc(item.name)}</p>
            <p class="b il" style="font-size:11px;margin-top:2px">${esc(item.detail)}</p>
          </div>
        </div>`;
    });
  }
  return `
    <div class="col">
      <button class="col-h" onclick="toggleCol('${type}')">
        <div>
          <p class="d ink" style="font-size:17px;margin:0;text-align:left">${data.title}</p>
          <p class="b il" style="font-size:11px;margin-top:2px;text-align:left">${data.duration} &middot; optional${cnt>0?' &middot; '+cnt+'/'+data.items.length+' done':''}</p>
        </div>
        <span class="is" style="transform:rotate(${isOpen?'90deg':'0'});transition:transform 0.2s">${I.cr}</span>
      </button>
      ${isOpen ? '<div class="col-b fade">'+items+'</div>' : ''}
    </div>`;
}

function renderExCard(item) {
  const ex = EX[item.id];
  if (!ex) return '';
  const sets = initSets(item.id, item.sets, item.reps);
  const hint = getProgressionHint(item.id);
  const cnt = sets.filter(s => s.completed).length;
  const showCue = cueOpen[item.id];

  let setsHTML = '';
  sets.forEach((set, idx) => {
    setsHTML += `
      <div class="set-r ${set.completed?'done':''}">
        <span class="set-n">${idx+1}</span>
        <input type="number" inputmode="decimal" value="${set.weight}" ${set.completed?'disabled':''} class="inp" style="width:64px" onchange="updSet('${item.id}',${idx},'weight',this.value)">
        <span class="b il" style="font-size:11px">${esc(ex.u)}</span>
        <span class="il">×</span>
        <input type="text" value="${esc(String(set.reps))}" ${set.completed?'disabled':''} class="inp" style="width:54px;text-align:center" onchange="updSet('${item.id}',${idx},'reps',this.value)">
        <button class="cb ${set.completed?'cb-d':'cb-a'}" ${set.completed?'disabled':''} onclick="completeSet('${item.id}',${idx})">${I.check}</button>
      </div>`;
  });

  return `
    <div class="card ex">
      <div class="ex-h">
        <div class="row-sb" style="align-items:flex-start">
          <div style="flex:1">
            <h3 class="d ink" style="font-size:19px;line-height:1.2;margin:0">${esc(ex.n)}</h3>
            <p class="b il" style="font-size:11px;margin-top:3px">${item.sets} sets × ${item.reps}</p>
          </div>
          <button class="btn-i" onclick="toggleCue('${item.id}')">${I.info}</button>
        </div>
        ${showCue ? '<div class="cue fade"><p class="b is" style="font-size:12px;font-style:italic;line-height:1.5;margin:0">'+esc(ex.cue)+'</p><a href="'+DEMO[item.id]+'" target="_blank" rel="noopener" class="b cl" style="font-size:11px;margin-top:8px;display:inline-block;letter-spacing:0.1em;text-transform:uppercase">Watch demo →</a></div>' : ''}
        ${hint ? '<div style="margin-top:10px" class="flx"><span class="cl">'+I.trend+'</span><p class="b cl" style="font-size:11px;font-style:italic;margin:0">'+hint+'</p></div>' : ''}
      </div>
      <div class="ex-s">${setsHTML}</div>
      <div class="ex-p">
        <div class="pb"><div class="pf" style="width:${(cnt/sets.length)*100}%"></div></div>
        <span class="b il" style="font-size:11px">${cnt}/${sets.length}</span>
      </div>
    </div>`;
}

function renderHistory() {
  const sorted = Object.entries(state.logs).sort(([a],[b]) => b.localeCompare(a));
  let body;
  if (sorted.length === 0) {
    body = '<div class="card" style="padding:28px;text-align:center"><p class="d is" style="font-size:17px;font-style:italic;margin:0">No sessions logged yet.</p><p class="b il" style="font-size:13px;margin-top:8px">Complete your first workout to start tracking.</p></div>';
  } else {
    body = '<div style="display:flex;flex-direction:column;gap:14px">';
    sorted.forEach(([key, sd]) => {
      const parts = key.split('__');
      const date = parts[0];
      const sessionKey = parts[1];
      const week = parts[2];
      let exHTML = '';
      Object.entries(sd).forEach(([exId, sets]) => {
        const ex = EX[exId];
        if (!ex || !sets) return;
        const completed = sets.filter(s => s && s.completed);
        if (completed.length === 0) return;
        const top = Math.max(...completed.map(s => parseFloat(s.weight)||0));
        exHTML += `<div class="b row-sb"><span class="is" style="font-size:13px">${esc(ex.n)}</span><span class="il" style="font-size:11px">${completed.length} sets &middot; top ${top}</span></div>`;
      });
      body += `<div class="card"><div style="margin-bottom:10px"><p class="eb">${date} &middot; ${week}</p><h3 class="d ink" style="font-size:18px;margin-top:4px">${esc(sessionKey)}</h3></div><div style="display:flex;flex-direction:column;gap:6px">${exHTML}</div></div>`;
    });
    body += '</div>';
  }
  return `
    <div class="app fade">
      <button onclick="goView('home')" class="is b" style="display:flex;align-items:center;gap:8px;margin-bottom:20px;padding:0">${I.cl}<span style="font-size:14px">Back</span></button>
      <div style="margin-bottom:24px">
        <p class="eb" style="margin-bottom:6px">Progress</p>
        <h1 class="d ink" style="font-size:32px;line-height:1.1;margin:0">History</h1>
      </div>
      ${body}
    </div>`;
}

// =============== ACTIONS ===============
function goView(v) {
  view = v;
  if (v === 'home') {
    currentSession = null; currentVariant = null;
    currentSets = {}; cueOpen = {};
    warmupOpen = false; cooldownOpen = false;
    warmupChecks = {}; cooldownChecks = {};
  }
  render();
}

function openPicker(key) {
  currentSession = key;
  currentSets = {}; cueOpen = {};
  warmupOpen = false; cooldownOpen = false;
  warmupChecks = {}; cooldownChecks = {};
  view = 'sessionPicker';
  render();
}

function loadVariant(variant) {
  currentVariant = variant;
  view = 'workout';
  currentSets = {};
  render();
}

function changeWeek(d) {
  state.currentWeek = Math.max(1, Math.min(12, state.currentWeek + d));
  saveState();
  render();
}

function toggleCue(id) { cueOpen[id] = !cueOpen[id]; render(); }
function toggleCol(type) { if (type==='warmup') warmupOpen = !warmupOpen; else cooldownOpen = !cooldownOpen; render(); }
function toggleColItem(type, id) { const c = type==='warmup'?warmupChecks:cooldownChecks; c[id] = !c[id]; render(); }
function toggleNutrition() { nutritionOpen = !nutritionOpen; render(); }

function updSet(exId, idx, field, value) {
  if (!currentSets[exId]) return;
  currentSets[exId][idx][field] = value;
}

function completeSet(exId, idx) {
  if (!currentSets[exId]) return;
  currentSets[exId][idx].completed = true;
  const today = todayStr();
  const k = lk(today, currentSession + (currentVariant ? '_' + currentVariant : ''), state.currentWeek);
  if (!state.logs[k]) state.logs[k] = {};
  if (!state.logs[k][exId]) state.logs[k][exId] = [];
  state.logs[k][exId][idx] = { ...currentSets[exId][idx] };
  saveState();
  render();
}

function markPelotonDone() {
  const today = todayStr();
  const k = lk(today, currentSession + '_peloton', state.currentWeek);
  state.logs[k] = { peloton: [{ completed: true, weight: 0, reps: 'Peloton class' }] };
  saveState();
  goView('home');
}

function finish() { goView('home'); }

function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'training-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported && imported.logs && typeof imported.currentWeek === 'number') {
        if (confirm('This will replace all current data. Continue?')) {
          state = imported;
          saveState();
          render();
          alert('Data restored.');
        }
      } else {
        alert('Invalid backup file.');
      }
    } catch(err) {
      alert('Could not read backup file.');
    }
  };
  reader.readAsText(file);
}

render();
</script>
</body>
</html>
