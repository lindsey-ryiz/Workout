<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  background: #F5EFE6;
  min-height: 100vh;
  font-family: 'Cormorant Garamond', Georgia, serif;
  color: #2B1810;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body {
  background: linear-gradient(180deg, #F5EFE6 0%, #EDE3D3 100%);
  min-height: 100vh;
}
.display { font-family: 'Cormorant Garamond', Georgia, serif; }
.body-f { font-family: 'Inter', system-ui, -apple-system, sans-serif; }

.ink { color: #2B1810; }
.ink-soft { color: #5C4530; }
.ink-light { color: #8B7355; }
.clay { color: #C97B5C; }
.sage { color: #7A8B6F; }

.app { padding: 48px 24px 96px; max-width: 600px; margin: 0 auto; }

.card {
  background: #FAF6EE;
  border: 1px solid #D4C5A9;
  border-radius: 2px;
  padding: 20px;
}

button { cursor: pointer; font-family: inherit; border: none; background: transparent; color: inherit; }

.btn-primary {
  background: #2B1810; color: #F5EFE6; padding: 16px; width: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
  border-radius: 2px; transition: transform 0.15s ease;
}
.btn-primary:active { transform: scale(0.98); }

.btn-clay { background: #C97B5C; color: #FAF6EE; border-radius: 2px; transition: transform 0.15s ease; }
.btn-clay:active { transform: scale(0.95); }

.btn-icon {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid #D4C5A9; border-radius: 2px; background: transparent; color: #5C4530;
}

.input-warm {
  background: #FAF6EE; border: 1px solid #D4C5A9; color: #2B1810;
  border-radius: 2px; font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px; padding: 8px 10px; transition: all 0.2s ease;
}
.input-warm:focus { outline: none; border-color: #C97B5C; box-shadow: 0 0 0 2px rgba(201, 123, 92, 0.15); }
.input-warm:disabled { opacity: 0.5; background: #EDE3D3; }

.label-eyebrow {
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: #8B7355;
}

.session-tag {
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 9px; padding: 3px 8px; border-radius: 2px;
  text-transform: uppercase; letter-spacing: 0.15em; color: #F5EFE6;
}
.tag-gym { background: #2B1810; }
.tag-home { background: #C97B5C; }
.tag-upper { background: #5C4530; }
.tag-cardio { background: #7A8B6F; }

.set-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.set-num { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; color: #8B7355; width: 20px; flex-shrink: 0; }

.check-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 2px; margin-left: auto; flex-shrink: 0; }
.check-active { background: #C97B5C; color: #FAF6EE; }
.check-done { background: #2B1810; color: #F5EFE6; }

.timer-card {
  background: #2B1810; color: #F5EFE6; padding: 16px; border-radius: 2px;
  display: flex; align-items: center; justify-content: space-between;
  margin: 0 20px 20px;
}
.timer-btn {
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  background: rgba(245, 239, 230, 0.1); border-radius: 2px; color: #F5EFE6;
}

.cue-box { margin-top: 12px; padding: 12px; background: #F5EFE6; border-left: 2px solid #C97B5C; }

.progress-bar { height: 4px; background: #EDE3D3; flex: 1; }
.progress-fill { height: 100%; background: #C97B5C; transition: width 0.3s ease; }

.fade-in { animation: fadeIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.icon { display: inline-block; vertical-align: middle; }
a { color: inherit; text-decoration: none; }
.set-completed { opacity: 0.5; }

.session-card { width: 100%; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; text-align: left; }
.exercise-card { overflow: hidden; padding: 0; }
.exercise-header { padding: 20px; border-bottom: 1px solid #D4C5A9; }
.exercise-sets { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.exercise-progress { padding: 0 20px 16px; display: flex; align-items: center; gap: 8px; }

.warmup-card {
  background: #EDE3D3;
  border: 1px solid #D4C5A9;
  border-radius: 2px;
  overflow: hidden;
}
.warmup-header {
  width: 100%; padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
  background: transparent;
}
.warmup-body { padding: 4px 20px 20px; }
.warmup-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 0;
  border-bottom: 1px solid #D4C5A9;
}
.warmup-item:last-child { border-bottom: none; }
.warmup-check {
  width: 24px; height: 24px;
  border: 1.5px solid #8B7355; border-radius: 2px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; background: transparent;
}
.warmup-check.done { background: #2B1810; border-color: #2B1810; color: #F5EFE6; }

.day-row {
  display: flex; align-items: center; gap: 12px; padding: 14px 0;
  border-bottom: 1px solid #EDE3D3;
}
.day-row:last-child { border-bottom: none; }

.day-label {
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #8B7355;
  width: 40px; flex-shrink: 0;
}

.cardio-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 0; border-bottom: 1px solid #EDE3D3;
}
.cardio-row:last-child { border-bottom: none; }

@media (min-width: 600px) {
  .app { padding: 56px 32px 96px; }
}

const STORAGE_KEY = 'training_tracker_v2';

function loadState() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) return JSON.parse(data);
  } catch(e) {}
  return { logs: {}, currentWeek: 1, cardioLog: {} };
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

function todayStr() { return new Date().toISOString().split('T')[0]; }
function logKey(date, sessionKey, week) { return date + '__' + sessionKey + '__W' + week; }

function getLastLog(sessionKey, exerciseId) {
  const entries = Object.entries(state.logs)
    .filter(([k]) => k.indexOf('__' + sessionKey + '__') !== -1)
    .sort(([a], [b]) => b.localeCompare(a));
  for (const [, sd] of entries) {
    if (sd[exerciseId]) return sd[exerciseId];
  }
  return null;
}

function getSuggestedLoad(sessionKey, exercise) {
  const last = getLastLog(sessionKey, exercise.id);
  if (!last || last.length === 0) return exercise.startLoad;
  const completed = last.filter(s => s && s.completed);
  if (completed.length === 0) return exercise.startLoad;
  const top = Math.max(...completed.map(s => parseFloat(s.weight) || 0));
  const allDone = last.length === exercise.sets && last.every(s => s && s.completed);
  return allDone ? top + 5 : top;
}

function isProgressed(sessionKey, exercise) {
  const last = getLastLog(sessionKey, exercise.id);
  if (!last) return false;
  return last.length === exercise.sets && last.every(s => s && s.completed);
}

function initSets(sessionKey, exercise) {
  if (currentSets[exercise.id]) return currentSets[exercise.id];
  const suggested = getSuggestedLoad(sessionKey, exercise);
  const sets = Array(exercise.sets).fill(null).map(() => ({
    weight: suggested, reps: exercise.reps.split('/')[0].trim(), completed: false
  }));
  currentSets[exercise.id] = sets;
  return sets;
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

}

  let itemsHTML = '';
  if (isOpen) {
    data.items.forEach(item => {
      const done = checks[item.id];
      itemsHTML += `
        <div class="warmup-item" style="${done ? 'opacity: 0.5;' : ''}">

function renderExerciseCard(ex) {
  const sets = initSets(currentSession, ex);
  const progressed = isProgressed(currentSession, ex);
  const completedCount = sets.filter(s => s.completed).length;
  const showCue = cueOpen[ex.id];
  const timer = activeTimers[ex.id];

  let setsHTML = '';
  sets.forEach((set, idx) => {
    setsHTML += `
      <div class="set-row ${set.completed ? 'set-completed' : ''}">
        <span class="set-num">${idx + 1}</span>
        <input type="number" inputmode="decimal" value="${set.weight}" ${set.completed ? 'disabled' : ''}
          class="input-warm" style="width: 70px;"
          onchange="updateSet('${ex.id}', ${idx}, 'weight', this.value)">
        <span class="body-f ink-light" style="font-size: 11px;">${escapeHTML(ex.unit)}</span>
        <span class="ink-light">×</span>
        <input type="text" value="${escapeHTML(String(set.reps))}" ${set.completed ? 'disabled' : ''}
          class="input-warm" style="width: 60px; text-align: center;"
          onchange="updateSet('${ex.id}', ${idx}, 'reps', this.value)">
        <button class="check-btn ${set.completed ? 'check-done' : 'check-active'}"
          ${set.completed ? 'disabled' : ''} onclick="completeSet('${ex.id}', ${idx})">
          ${icons.check}
        </button>
      </div>
    `;
  });

  let timerHTML = '';
  if (timer && timer.running) {
    timerHTML = `
      <div class="timer-card fade-in">
        <div>
          <p class="body-f" style="font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; margin: 0;">Resting</p>

        </div>
        <div style="display: flex; gap: 8px;">
          <button class="timer-btn" onclick="pauseTimer('${ex.id}')">${icons.pause}</button>
          <button class="timer-btn" onclick="stopTimer('${ex.id}')">${icons.x}</button>
        </div>
      </div>
    `;
  }

  return `
    <div class="card exercise-card">
      <div class="exercise-header">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
          <div style="flex: 1;">

        <div class="progress-bar">
          <div class="progress-fill" style="width: ${(completedCount / sets.length) * 100}%;"></div>
        </div>
        <span class="body-f ink-light" style="font-size: 11px;">${completedCount}/${sets.length}</span>

    </div>
  `;
}

function renderHistory() {
  const sortedLogs = Object.entries(state.logs).sort(([a], [b]) => b.localeCompare(a));
  let body;
  if (sortedLogs.length === 0) {
    body = `
      <div class="card" style="padding: 32px; text-align: center;">
        <p class="display ink-soft" style="font-size: 18px; font-style: italic; margin: 0;">No sessions logged yet.</p>
        <p class="body-f ink-light" style="font-size: 13px; margin-top: 8px;">Complete your first workout to start tracking.</p>
      </div>
    `;
  } else {
    body = '<div style="display: flex; flex-direction: column; gap: 16px;">';
    sortedLogs.forEach(([key, sd]) => {
      const parts = key.split('__');
      const date = parts[0];
      const sessionKey = parts[1];
      const week = parts[2];
      const session = PROGRAM.days[sessionKey];
      if (!session) return;
      let exHTML = '';
      Object.entries(sd).forEach(([exId, sets]) => {
        const ex = session.exercises.find(e => e.id === exId);
        if (!ex || !sets) return;
        const completed = sets.filter(s => s && s.completed);
        if (completed.length === 0) return;
        const top = Math.max(...completed.map(s => parseFloat(s.weight) || 0));
        exHTML += `
          <div class="body-f" style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
            <span class="ink-soft" style="font-size: 13px;">${escapeHTML(ex.name)}</span>
            <span class="ink-light" style="font-size: 11px;">${completed.length} sets · top ${top}</span>
          </div>
        `;
      });
      body += `
        <div class="card">
          <div style="margin-bottom: 12px;">
            <p class="label-eyebrow">${date} · ${week}</p>
            <h3 class="display ink" style="font-size: 20px; margin-top: 4px;">${session.name}</h3>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px;">${exHTML}</div>
        </div>
      `;
    });
    body += '</div>';
  }
  return `
    <div class="app fade-in">
      <button onclick="goView('home')" class="ink-soft body-f" style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px; padding: 0;">
        ${icons.chevronLeft} <span style="font-size: 14px;">Back</span>
      </button>
      <div style="margin-bottom: 32px;">
        <p class="label-eyebrow" style="margin-bottom: 8px;">Progress</p>
        <h1 class="display ink" style="font-size: 36px; line-height: 1.1; margin: 0;">History</h1>
      </div>
      ${body}
    </div>
  `;
}

function goView(v) {
  view = v;
  if (v === 'home') {
    currentSession = null;
    currentSets = {};
    cueOpen = {};
    warmupOpen = false;
    cooldownOpen = false;
    warmupChecks = {};
    cooldownChecks = {};
    Object.keys(activeTimers).forEach(stopTimer);
  }
  render();
}

function startSession(key) {
  currentSession = key;
  view = 'workout';
  currentSets = {};
  cueOpen = {};
  warmupOpen = false;
  cooldownOpen = false;
  warmupChecks = {};
  cooldownChecks = {};
  render();
}

function toggleWarmup(type) {
  if (type === 'warmup') warmupOpen = !warmupOpen;
  else cooldownOpen = !cooldownOpen;
  render();
}

function toggleWarmupItem(type, itemId) {
  const checks = type === 'warmup' ? warmupChecks : cooldownChecks;
  checks[itemId] = !checks[itemId];
  render();
}

function toggleNutrition() {
  nutritionOpen = !nutritionOpen;
  render();
}

            <span class="ink-light" style="font-size: 11px;">20g</span>
          </div>
          <div class="body-f" style="display: flex; justify-content: space-between; gap: 12px;">
            <span class="ink-soft" style="font-size: 12px;">Tuna pouch (StarKist Creations)</span>
            <span class="ink-light" style="font-size: 11px;">17g</span>
          </div>
          <div class="body-f" style="display: flex; justify-content: space-between; gap: 12px;">
            <span class="ink-soft" style="font-size: 12px;">1/2 cup cottage cheese</span>
            <span class="ink-light" style="font-size: 11px;">14g</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

function toggleNutrition() {
  nutritionOpen = !nutritionOpen;
  render();
}

function renderNutrition() {
  return `
    <div class="warmup-body fade-in">
      <div style="padding-top: 8px; padding-bottom: 16px;">
        <p class="label-eyebrow" style="margin-bottom: 8px;">Daily Target</p>
        <p class="display ink" style="font-size: 28px; line-height: 1; margin: 0;">130<span style="font-size: 16px; color: #8B7355;">g protein</span></p>
        <p class="body-f ink-light" style="font-size: 11px; margin-top: 4px; font-style: italic;">Spread across 4-5 eating events.</p>
      </div>

      <div style="padding: 16px 0; border-top: 1px solid #D4C5A9;">
        <p class="label-eyebrow" style="margin-bottom: 12px;">Sample Day</p>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          ${nutritionRow('Morning', 'Yogurt or cottage cheese + berries', '15-20g')}
          ${nutritionRow('Mid-morning', 'Protein shake (powder + water OR smoothie)', '25-30g')}
          ${nutritionRow('Lunch', '6 oz chicken + sweet potato/rice + avocado', '42g')}
          ${nutritionRow('Afternoon', 'Optional second shake on low days', '0-25g')}
          ${nutritionRow('Dinner', '6 oz chicken + rice/sweet potato + veg', '42g')}
          ${nutritionRow('8 PM', 'Cottage cheese + everything bagel seasoning', '14g')}
        </div>
      </div>

      <div style="padding: 16px 0; border-top: 1px solid #D4C5A9;">
        <p class="label-eyebrow" style="margin-bottom: 10px;">The Rules</p>
        <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px;">
          ${nutritionRule('Eat protein first at every meal, before carbs and fats.')}
          ${nutritionRule('Never miss the daily shake. Pick a time and protect it.')}
          ${nutritionRule('6 oz chicken portions, not 4. The cheapest protein upgrade.')}
          ${nutritionRule("Do not train fasted. Eat 60-90 min before gym days.")}
        </ul>
      </div>

      <div style="padding: 16px 0; border-top: 1px solid #D4C5A9;">
        <p class="label-eyebrow" style="margin-bottom: 10px;">Night Munchies Swap</p>
        <p class="body-f ink-soft" style="font-size: 12px; line-height: 1.6; margin: 0;">
          Replace random cheese grazing with one structured snack:
        </p>
        <ul style="list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 6px;">
          <li class="body-f ink-soft" style="font-size: 12px;">&middot; 1/2 cup cottage cheese + everything bagel seasoning (14g)</li>
          <li class="body-f ink-soft" style="font-size: 12px;">&middot; Greek yogurt + casein + frozen berries blended (45g)</li>
          <li class="body-f ink-soft" style="font-size: 12px;">&middot; Cottage cheese + honey + cinnamon (sweet version)</li>
        </ul>
      </div>

      <div style="padding: 16px 0 0; border-top: 1px solid #D4C5A9;">
        <p class="label-eyebrow" style="margin-bottom: 10px;">Pre-Workout (Wed/Fri)</p>
        <p class="body-f ink-soft" style="font-size: 12px; line-height: 1.6; margin: 0;">
          60-90 min before training: ~20g protein + carbs.
          Loaded smoothie works best (whey + Greek yogurt + banana + frozen berries).
          If you cannot stomach food, drink a Premier Protein or Fairlife Core Power.
        </p>
      </div>
    </div>
  `;
}

function nutritionRow(time, food, protein) {
  return `
    <div style="display: flex; gap: 12px; align-items: flex-start;">
      <div style="width: 80px; flex-shrink: 0;">
        <p class="body-f ink-light" style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin: 0;">${escapeHTML(time)}</p>
      </div>
      <div style="flex: 1;">
        <p class="body-f ink-soft" style="font-size: 12px; margin: 0; line-height: 1.4;">${escapeHTML(food)}</p>
      </div>
      <div style="flex-shrink: 0;">
        <p class="display clay" style="font-size: 14px; margin: 0; font-weight: 500;">${escapeHTML(protein)}</p>
      </div>
    </div>
  `;
}

function nutritionRule(text) {
  return `
    <li class="body-f ink-soft" style="font-size: 12px; line-height: 1.5; padding-left: 14px; position: relative;">
      <span class="clay" style="position: absolute; left: 0;">&middot;</span>
      ${escapeHTML(text)}
    </li>
  `;
}

function changeWeek(delta) {
  state.currentWeek = Math.max(1, Math.min(12, state.currentWeek + delta));
  saveState();
  render();
}

function toggleCue(exId) {
  cueOpen[exId] = !cueOpen[exId];
  render();
}

function updateSet(exId, idx, field, value) {
  if (!currentSets[exId]) return;
  currentSets[exId][idx][field] = value;
}

function completeSet(exId, idx) {
  if (!currentSets[exId]) return;
  currentSets[exId][idx].completed = true;
  const today = todayStr();
  const k = logKey(today, currentSession, state.currentWeek);
  if (!state.logs[k]) state.logs[k] = {};
  if (!state.logs[k][exId]) state.logs[k][exId] = [];
  state.logs[k][exId][idx] = { ...currentSets[exId][idx] };
  saveState();
  const session = PROGRAM.days[currentSession];
  const ex = session.exercises.find(e => e.id === exId);
  if (ex) startTimer(exId, ex.rest);
  render();
}

function startTimer(exId, seconds) {
  if (activeTimers[exId] && activeTimers[exId].intervalId) {
    clearInterval(activeTimers[exId].intervalId);
  }
  activeTimers[exId] = { remaining: seconds, running: true, intervalId: null };
  activeTimers[exId].intervalId = setInterval(() => {
    if (!activeTimers[exId]) return;
    activeTimers[exId].remaining -= 1;
    if (activeTimers[exId].remaining <= 0) {
      clearInterval(activeTimers[exId].intervalId);
      activeTimers[exId].running = false;
      activeTimers[exId].remaining = 0;
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }
    render();
  }, 1000);
}

function pauseTimer(exId) {
  if (activeTimers[exId]) {
    clearInterval(activeTimers[exId].intervalId);
    activeTimers[exId].running = false;
    render();
  }
}

function stopTimer(exId) {
  if (activeTimers[exId]) {
    clearInterval(activeTimers[exId].intervalId);
    delete activeTimers[exId];
    render();
  }
}

function finishSession() {
  Object.keys(activeTimers).forEach(id => {
    if (activeTimers[id].intervalId) clearInterval(activeTimers[id].intervalId);
  });
  activeTimers = {};
  goView('home');
}

render();
</script>
</body>
